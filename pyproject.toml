[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satom"
version = "1.0.0"
description = "SAtom – Sensitivity Analysis using the Kolmogorov-Smirnov 2-sample test (TOM method)"
readme = "README.md"
license = {text = "BSD-2-Clause"}
requires-python = ">=3.9"
authors = [
    {name = "Torben Østergård", email = "tostergard@build.aau.dk"},
    {name = "Markus Schaffer", email = "msc@build.aau.dk"},
]
keywords = ["sensitivity-analysis", "kolmogorov-smirnov", "TOM", "building-simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.22",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/markus-schaffer/satom_dev"
Repository = "https://github.com/markus-schaffer/satom_dev"

[tool.setuptools.packages.find]
where = ["src"]